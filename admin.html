<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>관리자 | 펀코딩샵</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500&family=Noto+Serif+KR:wght@500;600&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#0e2a24">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="turingshop">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/manage.css">
</head>
<body>
  <nav id="nav"></nav>
  <main>
    <h1>관리자</h1>

    <!-- 로그인 안 했을 때 -->
    <div id="login-box" class="card form" hidden>
      <form id="admin-form">
        <label for="email">관리자 이메일</label>
        <input id="email" type="email" required>
        <label for="password">비밀번호</label>
        <input id="password" type="password" required>
        <button type="submit">관리자 로그인</button>
      </form>
      <p id="msg" class="msg error"></p>
    </div>

    <!-- 관리자가 아닐 때 -->
    <div id="denied" class="card center" hidden>
      <p>관리자만 볼 수 있는 페이지입니다.</p>
      <button onclick="logout()">로그아웃 후 관리자로 로그인</button>
    </div>

    <!-- 관리자일 때 -->
    <div id="admin-box" hidden>
      <div class="tabs admin-tabs">
        <button type="button" class="active" data-tab="orders-tab">결제 내역</button>
        <button type="button" data-tab="products-tab">상품 관리</button>
      </div>

      <!-- 탭 1: 결제 내역 -->
      <section id="orders-tab">
        <div class="stats">
          <div class="card"><div class="num" id="stat-count">-</div><div class="label">결제 완료 건수</div></div>
          <div class="card"><div class="num" id="stat-total">-</div><div class="label">결제 완료 금액</div></div>
        </div>
        <div class="card table-wrap" id="list">불러오는 중...</div>
      </section>

      <!-- 탭 2: 상품 관리 -->
      <section id="products-tab" hidden>
        <div class="manage">
          <form id="product-form" class="card product-form" novalidate>
            <h2 id="form-title">새 상품 등록</h2>
            <label for="p-name">이름</label>
            <input id="p-name" type="text">
            <label for="p-category">분류</label>
            <input id="p-category" type="text" placeholder="예: 시계">
            <label for="p-price">가격 (원)</label>
            <input id="p-price" type="number" min="1" step="1" inputmode="numeric">
            <label for="p-image">이미지 주소</label>
            <input id="p-image" type="text" placeholder="https://...">
            <label for="p-detail">상세 설명</label>
            <textarea id="p-detail" rows="5"></textarea>
            <div class="form-buttons">
              <button type="submit" id="save-btn">등록하기</button>
              <button type="button" id="cancel-edit" class="secondary" hidden>취소</button>
            </div>
            <p id="form-msg" class="msg"></p>
          </form>

          <div>
            <p id="list-msg" class="msg"></p>
            <div class="card table-wrap" id="product-list">불러오는 중...</div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script>
    async function init() {
      const user = await getUser();
      if (!user) { document.getElementById("login-box").hidden = false; return; }
      if (user.email !== ADMIN_EMAIL) { document.getElementById("denied").hidden = false; return; }
      document.getElementById("admin-box").hidden = false;
      loadAllOrders();
      loadProducts();
    }

    document.getElementById("admin-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const { error } = await sb.auth.signInWithPassword({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value,
      });
      if (error) {
        document.getElementById("msg").textContent = "이메일 또는 비밀번호가 올바르지 않습니다.";
        return;
      }
      location.reload();
    });

    // 탭 바꾸기
    document.querySelectorAll(".admin-tabs button").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".admin-tabs button").forEach(t => {
          t.classList.toggle("active", t === tab);
          document.getElementById(t.dataset.tab).hidden = t !== tab;
        });
      });
    });

    // ── 결제 내역 ── 관리자는 RLS 정책에 따라 모든 주문을 볼 수 있음
    async function loadAllOrders() {
      const { data, error } = await sb.from("orders")
        .select("*")
        .neq("status", "pending") // 결제창을 닫아 결제하지 않은 주문은 빼고
        .order("created_at", { ascending: false });

      const box = document.getElementById("list");
      if (error) { box.innerHTML = `<p class="msg error">${esc(error.message)}</p>`; return; }

      const paid = data.filter(o => o.status === "paid");
      document.getElementById("stat-count").textContent = paid.length + "건";
      document.getElementById("stat-total").textContent = won(paid.reduce((s, o) => s + o.amount, 0));

      if (!data.length) { box.innerHTML = `<p class="empty">아직 주문이 없습니다.</p>`; return; }
      box.innerHTML = `<table>
        <tr><th>주문일시</th><th>회원 이메일</th><th>상품</th><th>금액</th><th>상태</th><th>결제일시</th><th>취소</th></tr>
        ${data.map(o => `<tr>
          <td data-label="주문일시">${dateText(o.created_at)}</td>
          <td data-label="회원">${esc(o.user_email)}</td>
          <td data-label="상품">${esc(o.product_name)}</td>
          <td data-label="금액">${won(o.amount)}</td>
          <td data-label="상태">${statusBadge(o.status)}</td>
          <td data-label="결제일시">${dateText(o.paid_at)}</td>
          <td data-label="취소">${o.status === "paid"
            ? `<button class="secondary small" data-order="${esc(o.order_id)}">결제 취소</button>` : "-"}</td>
        </tr>`).join("")}
      </table>`;
    }

    document.getElementById("list").addEventListener("click", async (e) => {
      const btn = e.target.closest("button[data-order]");
      if (!btn) return;
      if (!confirm("이 결제를 취소할까요? 취소하면 되돌릴 수 없습니다.")) return;
      btn.disabled = true;
      try {
        await callFunction("cancel-payment", { orderId: btn.dataset.order });
        await loadAllOrders();
      } catch (error) {
        alert(error.message);
        btn.disabled = false;
      }
    });

    // ── 상품 관리 ──
    let products = [];
    let editingId = null; // 수정 중인 상품 id (새로 등록할 때는 null)
    const field = id => document.getElementById(id);

    function showMsg(id, text, ok) {
      field(id).textContent = text;
      field(id).className = "msg " + (ok ? "ok" : "error");
    }

    async function loadProducts() {
      const { data, error } = await sb.from("products").select("*").order("id");
      const box = field("product-list");
      if (error) { box.innerHTML = `<p class="msg error">${esc(error.message)}</p>`; return; }
      products = data;
      if (!data.length) { box.innerHTML = `<p class="empty">등록된 상품이 없습니다.</p>`; return; }
      box.innerHTML = `<ul class="plist">
        ${data.map(p => `<li>
          <span class="thumb">${p.image_url ? `<img src="${esc(p.image_url)}" alt="">` : ""}</span>
          <span class="pinfo">
            <span class="pcat">${esc(p.description)}</span>
            <span class="pname">${esc(p.name)}</span>
            <span class="pprice">${won(p.price)}</span>
          </span>
          <span class="pbuttons">
            <button class="secondary small" data-edit="${p.id}">수정</button>
            <button class="secondary small danger" data-delete="${p.id}">삭제</button>
          </span>
        </li>`).join("")}
      </ul>`;
    }

    // 폼을 "새 상품 등록" 상태로 되돌림
    function resetForm() {
      editingId = null;
      field("product-form").reset();
      field("form-title").textContent = "새 상품 등록";
      field("save-btn").textContent = "등록하기";
      field("cancel-edit").hidden = true;
    }

    function startEdit(p) {
      editingId = p.id;
      field("p-name").value = p.name;
      field("p-category").value = p.description;
      field("p-price").value = p.price;
      field("p-image").value = p.image_url;
      field("p-detail").value = p.detail;
      field("form-title").textContent = "상품 수정";
      field("save-btn").textContent = "수정 저장";
      field("cancel-edit").hidden = false;
      field("form-msg").textContent = "";
      field("product-form").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    field("cancel-edit").addEventListener("click", () => {
      resetForm();
      field("form-msg").textContent = "";
    });

    field("product-list").addEventListener("click", async (e) => {
      const editBtn = e.target.closest("button[data-edit]");
      const delBtn = e.target.closest("button[data-delete]");
      if (editBtn) {
        const p = products.find(x => x.id === Number(editBtn.dataset.edit));
        if (p) startEdit(p);
      }
      if (delBtn) {
        const id = Number(delBtn.dataset.delete);
        const p = products.find(x => x.id === id);
        if (!p || !confirm(`"${p.name}" 상품을 삭제할까요? 삭제하면 되돌릴 수 없습니다.`)) return;
        delBtn.disabled = true;
        const { error } = await sb.from("products").delete().eq("id", id);
        if (error) {
          showMsg("list-msg", "삭제하지 못했습니다: " + error.message, false);
          delBtn.disabled = false;
          return;
        }
        if (editingId === id) resetForm();
        showMsg("list-msg", "상품을 삭제했습니다.", true);
        loadProducts();
      }
    });

    field("product-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = field("p-name").value.trim();
      const description = field("p-category").value.trim();
      const priceText = field("p-price").value.trim();
      const price = Number(priceText);
      const image_url = field("p-image").value.trim();
      const detail = field("p-detail").value.trim();

      if (!name) return showMsg("form-msg", "이름을 입력해 주세요.", false);
      if (!description) return showMsg("form-msg", "분류를 입력해 주세요.", false);
      if (!priceText || !Number.isInteger(price) || price < 1 || price > 100000000) {
        return showMsg("form-msg", "가격은 1원 ~ 1억 원 사이의 정수로 입력해 주세요.", false);
      }
      if (image_url && !image_url.startsWith("https://")) {
        return showMsg("form-msg", "이미지 주소는 https:// 로 시작해야 합니다.", false);
      }

      const row = { name, description, price, image_url, detail };
      field("save-btn").disabled = true;
      const { error } = editingId
        ? await sb.from("products").update(row).eq("id", editingId)
        : await sb.from("products").insert(row);
      field("save-btn").disabled = false;

      if (error) return showMsg("form-msg", "저장하지 못했습니다: " + error.message, false);
      showMsg("form-msg", editingId ? "상품을 수정했습니다." : "새 상품을 등록했습니다.", true);
      resetForm();
      loadProducts();
    });

    init();
  </script>
</body>
</html>
