<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>결제 결과 | 펀코딩샵</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500&family=Noto+Serif+KR:wght@500;600&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#0e2a24">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="turingshop">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav id="nav"></nav>
  <main>
    <div class="card center">
      <h1 id="title">결제 확인 중...</h1>
      <p id="detail" class="msg"></p>
      <p><a class="btn" href="orders.html">내 결제 내역 보기</a></p>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script>
    // 토스가 넘겨준 값으로 서버(Edge Function)에 결제 승인 요청
    async function confirmPayment() {
      if (!(await requireLogin())) return;
      const q = new URLSearchParams(location.search);
      const title = document.getElementById("title");
      const detail = document.getElementById("detail");
      try {
        const data = await callFunction("confirm-payment", {
          paymentKey: q.get("paymentKey"),
          orderId: q.get("orderId"),
          amount: Number(q.get("amount")),
        });
        clearCart();
        title.textContent = "결제가 완료되었습니다";
        detail.innerHTML = `${esc(data.order.product_name)}<br><strong>${won(data.order.amount)}</strong>`;
      } catch (e) {
        title.textContent = "결제에 실패했습니다";
        detail.className = "msg error";
        detail.textContent = e.message;
      }
    }

    confirmPayment();
  </script>
</body>
</html>
