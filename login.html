<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 | MAISON</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500&family=Noto+Serif+KR:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav id="nav"></nav>
  <main>
    <div class="card form">
      <div class="tabs">
        <button id="tab-login" class="active" onclick="setMode('login')">로그인</button>
        <button id="tab-signup" onclick="setMode('signup')">회원가입</button>
      </div>
      <form id="auth-form">
        <label for="email">이메일</label>
        <input id="email" type="email" required autocomplete="email">
        <label for="password">비밀번호 (6자 이상)</label>
        <input id="password" type="password" required minlength="6" autocomplete="current-password">
        <button type="submit" id="submit-btn">로그인</button>
      </form>
      <p id="msg" class="msg"></p>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script>
    let mode = "login";

    function setMode(m) {
      mode = m;
      document.getElementById("tab-login").classList.toggle("active", m === "login");
      document.getElementById("tab-signup").classList.toggle("active", m === "signup");
      document.getElementById("submit-btn").textContent = m === "login" ? "로그인" : "회원가입";
      document.getElementById("msg").textContent = "";
    }

    document.getElementById("auth-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const msg = document.getElementById("msg");
      const btn = document.getElementById("submit-btn");
      btn.disabled = true;
      msg.className = "msg";
      msg.textContent = "처리 중...";

      const { data, error } = mode === "login"
        ? await sb.auth.signInWithPassword({ email, password })
        : await sb.auth.signUp({ email, password });

      btn.disabled = false;
      if (error) {
        msg.className = "msg error";
        msg.textContent = error.message === "Invalid login credentials"
          ? "이메일 또는 비밀번호가 올바르지 않습니다."
          : error.message;
        return;
      }
      location.href = data.user.email === ADMIN_EMAIL ? "admin.html" : "index.html";
    });
  </script>
</body>
</html>
