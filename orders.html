<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 결제 내역 | MAISON</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500&family=Noto+Serif+KR:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/manage.css">
</head>
<body>
  <nav id="nav"></nav>
  <main>
    <h1>내 결제 내역</h1>
    <div class="card table-wrap" id="list">불러오는 중...</div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script>
    async function loadOrders() {
      const user = await requireLogin();
      if (!user) return;
      const { data, error } = await sb.from("orders")
        .select("*")
        .eq("user_id", user.id)
        .neq("status", "pending") // 결제창을 닫아 결제하지 않은 주문은 보이지 않게
        .order("created_at", { ascending: false });

      const box = document.getElementById("list");
      if (error) { box.innerHTML = `<p class="msg error">${esc(error.message)}</p>`; return; }
      if (!data.length) { box.innerHTML = `<p class="empty">아직 결제 내역이 없습니다.</p>`; return; }

      box.innerHTML = `<table>
        <tr><th>주문일시</th><th>상품</th><th>금액</th><th>상태</th><th>취소</th></tr>
        ${data.map(o => `<tr>
          <td data-label="주문일시">${dateText(o.created_at)}</td>
          <td data-label="상품">${esc(o.product_name)}</td>
          <td data-label="금액">${won(o.amount)}</td>
          <td data-label="상태">${statusBadge(o.status)}</td>
          <td data-label="취소">${o.status === "paid"
            ? `<button class="secondary small" data-order="${esc(o.order_id)}">결제 취소</button>` : "-"}</td>
        </tr>`).join("")}
      </table>`;
    }

    // 결제 취소 버튼 (목록을 다시 그려도 동작하도록 상자에 한 번만 연결)
    document.getElementById("list").addEventListener("click", async (e) => {
      const btn = e.target.closest("button[data-order]");
      if (!btn) return;
      if (!confirm("이 결제를 취소할까요? 취소하면 되돌릴 수 없습니다.")) return;
      btn.disabled = true;
      try {
        await callFunction("cancel-payment", { orderId: btn.dataset.order });
        await loadOrders();
      } catch (error) {
        alert(error.message);
        btn.disabled = false;
      }
    });

    loadOrders();
  </script>
</body>
</html>
