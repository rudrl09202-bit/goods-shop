<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>펀코딩샵</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500&family=Noto+Serif+KR:wght@500;600&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#0e2a24">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="turingshop">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav id="nav"></nav>
  <header class="hero">
    <div class="hero-text">
      <span class="hero-line"></span>
      <h1>쓸수록 내 것이 되는 물건</h1>
      <p>손때 묻을수록 깊어지는 가죽, 매일 곁에 두고 싶은 주얼리와 시계<br>오래 함께할 열두 가지를 골랐습니다</p>
      <a class="btn gold" href="#collection">컬렉션 보기</a>
    </div>
    <div class="hero-photos" aria-hidden="true">
      <img src="https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?w=700&q=80" alt="">
      <img src="https://images.unsplash.com/photo-1594223274512-ad4803739b7c?w=700&q=80" alt="">
      <img src="https://images.unsplash.com/photo-1524592094714-0f0654e20314?w=700&q=80" alt="">
    </div>
  </header>
  <main>
    <!-- 인기 상품: 판매 기록이 있을 때만 보임 -->
    <section class="popular-section" id="popular" hidden>
      <div class="section-title">
        <h2>인기 상품</h2>
        <p>가장 많이 팔린 상품</p>
      </div>
      <div id="popular-products" class="products popular"></div>
    </section>
    <div class="section-title" id="collection">
      <h2>컬렉션</h2>
      <p id="count"></p>
    </div>
    <div id="products" class="products"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script>
    async function loadProducts() {
      const { data, error } = await sb.from("products").select("*").order("id");
      const box = document.getElementById("products");
      if (error) {
        box.innerHTML = `<p class="msg error">상품을 불러오지 못했습니다: ${esc(error.message)}</p>`;
        return;
      }
      document.getElementById("count").textContent = `${data.length}점`;
      box.innerHTML = data.map(productCard).join("");
    }

    // 인기 상품: 결제 완료 수량이 많은 순 (DB 함수 popular_products)
    async function loadPopular() {
      const { data, error } = await sb.rpc("popular_products", { max_count: 4 });
      // 실패하거나 판매 기록이 없으면 섹션을 숨긴 채로 둠
      if (error || !data.length) return;
      document.getElementById("popular-products").innerHTML = data.map(productCard).join("");
      document.getElementById("popular").hidden = false;
    }

    function productCard(p) {
      return `
        <div class="product">
          <a href="product.html?id=${p.id}" aria-label="${esc(p.name)} 자세히 보기">
            <span class="photo"><img src="${esc(p.image_url)}" alt="" loading="lazy"><span class="buy">자세히 보기</span></span>
            <span class="desc">${esc(p.description)}</span>
            <span class="name">${esc(p.name)}</span>
            <span class="price">${won(p.price)}</span>
          </a>
          <div class="product-actions">
            <button class="secondary" onclick="addToCart(${p.id})">장바구니 담기</button>
            <button onclick="buyNow(${p.id})">바로 구매</button>
            <button class="link" onclick="removeFromCart(${p.id})">취소</button>
          </div>
        </div>`;
    }

    function buyNow(id) {
      addToCart(id);
      location.href = "cart.html";
    }

    loadPopular();
    loadProducts();
  </script>
</body>
</html>
