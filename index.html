<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAISON</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500&family=Noto+Serif+KR:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav id="nav"></nav>
  <header class="hero">
    <div class="hero-text">
      <span class="hero-line"></span>
      <h1>오래 쓰는 물건들</h1>
      <p>가죽 소품과 주얼리, 시계까지<br>직접 고른 열두 가지</p>
      <a class="btn gold" href="#collection">컬렉션 보기</a>
    </div>
    <div class="hero-photos" aria-hidden="true">
      <img src="https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?w=700&q=80" alt="">
      <img src="https://images.unsplash.com/photo-1594223274512-ad4803739b7c?w=700&q=80" alt="">
      <img src="https://images.unsplash.com/photo-1524592094714-0f0654e20314?w=700&q=80" alt="">
    </div>
  </header>
  <main>
    <div class="section-title" id="collection">
      <h2>컬렉션</h2>
      <p id="count"></p>
    </div>
    <div id="products" class="products"></div>

    <section id="checkout" class="card" hidden>
      <div class="summary">
        <strong id="checkout-name"></strong>
        <strong id="checkout-price"></strong>
      </div>
      <div id="payment-method"></div>
      <div id="agreement"></div>
      <div class="actions">
        <button class="secondary" onclick="closeCheckout()">취소</button>
        <button id="pay-btn" onclick="pay()">결제하기</button>
      </div>
      <p id="pay-msg" class="msg error"></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://js.tosspayments.com/v2/standard"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script>
    let products = [];
    let selected = null;
    let widgets = null;

    async function loadProducts() {
      const { data, error } = await sb.from("products").select("*").order("id");
      const box = document.getElementById("products");
      if (error) {
        box.innerHTML = `<p class="msg error">상품을 불러오지 못했습니다: ${error.message}</p>`;
        return;
      }
      products = data;
      document.getElementById("count").textContent = `${data.length}점`;
      box.innerHTML = data.map(p => `
        <button class="product" onclick="buy(${p.id})" aria-label="${p.name} 구매하기">
          <span class="photo"><img src="${p.image_url}" alt="" loading="lazy"><span class="buy">구매하기</span></span>
          <span class="desc">${p.description}</span>
          <span class="name">${p.name}</span>
          <span class="price">${won(p.price)}</span>
        </button>`).join("");
    }

    // 상품 선택 → 토스 결제위젯 표시
    async function buy(id) {
      const user = await getUser();
      if (!user) {
        alert("로그인 후 구매할 수 있습니다.");
        location.href = "login.html";
        return;
      }
      selected = products.find(p => p.id === id);
      document.getElementById("checkout-name").textContent = selected.name;
      document.getElementById("checkout-price").textContent = won(selected.price);
      document.getElementById("pay-msg").textContent = "";
      document.getElementById("checkout").hidden = false;

      const amount = { currency: "KRW", value: selected.price };
      if (!widgets) {
        widgets = TossPayments(TOSS_CLIENT_KEY).widgets({ customerKey: user.id });
        await widgets.setAmount(amount);
        await Promise.all([
          widgets.renderPaymentMethods({ selector: "#payment-method", variantKey: "DEFAULT" }),
          widgets.renderAgreement({ selector: "#agreement", variantKey: "AGREEMENT" }),
        ]);
      } else {
        await widgets.setAmount(amount);
      }
      document.getElementById("checkout").scrollIntoView({ behavior: "smooth" });
    }

    function closeCheckout() {
      document.getElementById("checkout").hidden = true;
    }

    // 주문 저장 → 토스 결제창 열기
    async function pay() {
      const btn = document.getElementById("pay-btn");
      const msg = document.getElementById("pay-msg");
      btn.disabled = true;
      msg.textContent = "";

      const orderId = crypto.randomUUID();
      const { error } = await sb.from("orders").insert({
        order_id: orderId,
        product_id: selected.id,
        product_name: selected.name,
        amount: selected.price,
      });
      if (error) {
        msg.textContent = "주문을 만들지 못했습니다: " + error.message;
        btn.disabled = false;
        return;
      }

      const user = await getUser();
      try {
        await widgets.requestPayment({
          orderId,
          orderName: selected.name,
          customerEmail: user.email,
          successUrl: new URL("success.html", location.href).href,
          failUrl: new URL("fail.html", location.href).href,
        });
      } catch (e) {
        msg.textContent = e.message || "결제가 취소되었습니다.";
      }
      btn.disabled = false;
    }

    loadProducts();
  </script>
</body>
</html>
